
services:
  postgres:
    image: postgres:16
    container_name: netsentinel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: netsentinel
      POSTGRES_PASSWORD: netsentinel_dev_2026
      POSTGRES_DB: netsentinel_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsentinel -d netsentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
